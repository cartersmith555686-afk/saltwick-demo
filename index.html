<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Handmade soap, bath bombs and soy candles, made in small batches.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23B3225E'/%3E%3Ccircle cx='11' cy='12' r='3' fill='white' opacity='.7'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Saltwick Bath &amp; Candle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one shell (header, routed main, footer) with hash-routed pages. Big three-beat headline on home, shelf grid, cart and checkout as two-column forms. */
:root {
  --bg: #EAF1EE;
  --surface: #F6FAF8;
  --fg: #12312C;
  --muted: #4C6761;
  --accent: #B3225E;
  --accent-ink: #FFFFFF;
  --sea: #9ED3C6;
  --lilac: #C9B8EA;
  --line: #C5D6D0;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1D1B; --surface: #152826; --fg: #E3F0EB; --muted: #9FB8B1;
    --accent: #F28DBA; --accent-ink: #2A0A19; --sea: #2F6B60; --lilac: #6B5A9A; --line: #2A4540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1D1B; --surface: #152826; --fg: #E3F0EB; --muted: #9FB8B1;
  --accent: #F28DBA; --accent-ink: #2A0A19; --sea: #2F6B60; --lilac: #6B5A9A; --line: #2A4540;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.04; }
p { margin: 0; }
a { color: inherit; }
main:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.label { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* header */
header { display: flex; align-items: center; justify-content: space-between; gap: 14px 20px; padding-block: 20px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; text-decoration: none; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 8px 20px; font-weight: 500; font-size: 15px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding-block: 4px; border-bottom: 2px solid transparent; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.hacts { display: flex; gap: 8px; align-items: center; }
.hbtn { text-decoration: none; font-weight: 600; font-size: 14.5px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--fg); display: inline-flex; align-items: center; gap: 8px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbtn b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 12.5px; padding-inline: 6px; font-family: var(--font-mono); }
@media (max-width: 760px) { nav { order: 3; width: 100%; } }

/* buttons and forms */
.btn { display: inline-block; font: 600 16px var(--font-body); padding: 13px 22px; border-radius: 999px; border: 2px solid var(--fg); background: transparent; color: var(--fg); text-decoration: none; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 8px 16px; font-size: 14px; }
.btn:hover { transform: translateY(-1px); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.mini { font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.span2 { grid-column: 1 / -1; }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field textarea, .sel, .search { font: 400 16px var(--font-body); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px; width: 100%; min-width: 0; }
.field textarea { min-height: 84px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; grid-column: 1 / -1; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
@media (max-width: 560px) { .form { grid-template-columns: minmax(0, 1fr); } }

/* pages */
.page { padding-block: 28px 0; display: grid; gap: 28px; }
.page-title { font-size: clamp(36px, 7vw, 64px); font-weight: 800; letter-spacing: -.03em; }
.page-sub { color: var(--muted); max-width: 52ch; margin-top: 10px; font-size: 18px; }
.crumbs { font-size: 14px; }
.crumbs a { color: var(--muted); }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(30px, 5.5vw, 48px); font-weight: 800; letter-spacing: -.03em; }
.two { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 800px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* hero */
.hero { padding-block: 24px 36px; display: grid; gap: 32px; position: relative; }
.hero h1 { font-size: clamp(46px, 10.5vw, 120px); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: end; }
.hero p.lede { font-size: 20px; max-width: 34ch; color: var(--muted); }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.trio { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.trio svg { width: 31%; height: auto; max-width: 150px; overflow: visible; }
.bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
.bubbles i { position: absolute; border-radius: 50%; border: 2px solid var(--sea); opacity: .7; animation: drift 9s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateY(-18px); } }
@media (max-width: 760px) { .hero-row { grid-template-columns: minmax(0, 1fr); } }

.bench { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 2px solid var(--fg); }
.bench div { padding: 20px 20px 22px; display: grid; gap: 6px; align-content: start; }
.bench div + div { border-left: 1px solid var(--line); }
.bench b { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.bench span { color: var(--muted); font-size: 15px; }
@media (max-width: 760px) { .bench { grid-template-columns: minmax(0, 1fr); } .bench div + div { border-left: 0; border-top: 1px solid var(--line); } }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.tile { border-radius: 18px; padding: 26px; display: grid; gap: 12px; align-content: start; }
.tile h3 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.tile p { color: var(--muted); max-width: 36ch; }
.tile .btn { justify-self: start; margin-top: 6px; }
.tile.a { background: color-mix(in srgb, var(--sea) 45%, var(--surface)); }
.tile.b { background: color-mix(in srgb, var(--lilac) 45%, var(--surface)); }
@media (max-width: 700px) { .tiles { grid-template-columns: minmax(0, 1fr); } }

/* shop */
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.controls .search { flex: 1 1 220px; max-width: 360px; }
.controls .sel { width: auto; flex: 0 0 auto; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { font: 500 15px var(--font-body); padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; min-width: 0; }
.thumb { height: 92px; border-radius: 10px; display: grid; place-items: center; text-decoration: none; }
.thumb svg { height: 70px; width: auto; }
.thumb.big { height: auto; min-height: 300px; border-radius: 16px; }
.thumb.big svg { height: 200px; }
.card h3 { font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.card .notes { color: var(--muted); font-size: 15px; line-height: 1.45; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.acts { display: flex; gap: 8px; align-items: center; }
.price { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
.price small { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.add { font: 600 14px var(--font-body); padding: 8px 16px; border-radius: 999px; border: 2px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.add:hover { background: var(--accent); color: var(--accent-ink); }
.heart { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.heart svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.heart[aria-pressed="true"] { border-color: var(--accent); }
.heart[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
.t-soap { background: color-mix(in srgb, var(--sea) 45%, var(--surface)); }
.t-bomb { background: color-mix(in srgb, var(--lilac) 45%, var(--surface)); }
.t-candle { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.t-gift { background: color-mix(in srgb, var(--sea) 30%, var(--lilac) 30%); }
.pill { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; display: inline-block; }
.incl ul { margin: 6px 0 0; padding-left: 18px; font-size: 15px; }
.empty { color: var(--muted); }

/* product page */
.pdp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 760px) { .pdp { grid-template-columns: minmax(0, 1fr); } }
.pdp h1 { font-size: clamp(36px, 6vw, 56px); font-weight: 800; letter-spacing: -.03em; }
.pdp-info { display: grid; gap: 18px; min-width: 0; }
.buyrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 17px; line-height: 1; }
.acc details { border-top: 1px solid var(--line); padding-block: 12px; }
.acc details:last-child { border-bottom: 1px solid var(--line); }
.acc summary { font-weight: 600; cursor: pointer; }
.acc details p { margin-top: 8px; color: var(--muted); font-size: 16px; max-width: 60ch; }

/* cart and checkout */
.lines { display: grid; gap: 0; }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 16px; border-top: 1px solid var(--line); }
.line:last-child { border-bottom: 1px solid var(--line); }
.line .thumb { height: 64px; }
.line .thumb svg { height: 44px; }
.line h3 { font-size: 19px; font-weight: 700; }
.line .meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.line .tot { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 12px; min-width: 0; }
.sum h2 { font-size: 26px; font-weight: 700; }
.row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.row.total { border-top: 1.5px solid var(--line); padding-top: 12px; font-weight: 500; font-size: 17px; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.promo { display: flex; gap: 8px; }
.promo input { flex: 1; min-width: 0; font: 400 16px var(--font-body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; text-transform: uppercase; }
.msg { font-size: 14px; min-height: 1.3em; }
.msg.err { color: var(--accent); }
.note { font-size: 14px; color: var(--muted); }
.ordertext { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--font-mono); width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid; place-items: center; }
.copyrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.copyrow code { font-family: var(--font-mono); font-size: 15px; overflow-wrap: anywhere; }

/* finder */
.quiz { display: flex; gap: 10px; flex-wrap: wrap; }
.quiz button { font: 600 16px var(--font-body); padding: 14px 22px; border-radius: 14px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
.quiz button:hover { background: var(--fg); color: var(--bg); }

/* orders */
.orders { display: grid; gap: 10px; }
.orders details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.orders summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 500; }
.orders ul { margin: 10px 0 0; padding-left: 18px; font-size: 15px; color: var(--muted); }

.story { max-width: 62ch; display: grid; gap: 14px; color: var(--muted); }
.story p:first-child { color: var(--fg); font-size: 21px; }

footer { margin-top: 64px; padding-top: 28px; border-top: 2px solid var(--fg); display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; color: var(--muted); font-size: 14.5px; }
footer nav { font-size: 14.5px; }

.toasts { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; pointer-events: none; z-index: 20; }
.toast { pointer-events: auto; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 11px 18px; font-size: 15px; max-width: 520px; box-shadow: 0 6px 24px rgba(0, 0, 0, .22); }
.toast a { color: inherit; font-weight: 600; margin-left: 6px; }

/* motion */
.ticker { overflow: hidden; border-bottom: 1.5px solid var(--line); padding-block: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ticker .track { display: flex; width: max-content; animation: tick 38s linear infinite; }
.ticker:hover .track { animation-play-state: paused; }
.ticker .grp { display: flex; }
.ticker .grp span { padding-right: 48px; white-space: nowrap; }
@keyframes tick { to { transform: translateX(-50%); } }
.hbtn.iconbtn { background: transparent; color: var(--fg); cursor: pointer; padding: 7px 10px; font-family: inherit; }
#view.enter { animation: pagein .45s cubic-bezier(.2, .7, .2, 1); }
@keyframes pagein { from { transform: translateY(10px); } }
.hl { display: block; animation: rise .8s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--d, 0) * 110ms); }
@keyframes rise { from { transform: translateY(28px); } }
.grid .card { animation: cardin .55s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(min(var(--i, 0), 8) * 55ms); transition: transform .2s ease, box-shadow .2s ease; }
@keyframes cardin { from { transform: translateY(16px); } }
.still .card { animation: none; }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px -14px color-mix(in srgb, var(--fg) 45%, transparent); }
.thumb svg { overflow: visible; }
.trio svg { animation: float 5s ease-in-out infinite alternate; }
.trio svg:nth-child(2) { animation-delay: -1.7s; }
.trio svg:nth-child(3) { animation-delay: -3.3s; }
@keyframes float { to { transform: translateY(-10px) rotate(1.5deg); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; }
.thumb:hover .flame, .thumb.big .flame, .trio .flame { animation: flicker 1.5s ease-in-out infinite alternate; }
@keyframes flicker { 0% { transform: scale(1, 1) rotate(-1.5deg); } 50% { transform: scale(.94, 1.07) rotate(1.5deg); } 100% { transform: scale(1.05, .97) rotate(-.5deg); } }
.fz { opacity: 0; }
.thumb:hover .fz, .thumb.big .fz, .trio .fz { animation: fizz 2.4s ease-in infinite; }
@keyframes fizz { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-26px); opacity: 0; } }
.heart.pop svg { animation: pop .4s ease; }
@keyframes pop { 40% { transform: scale(1.4); } }
.hbtn b.bump { animation: pop .4s ease; }
.add.done { background: var(--accent); color: var(--accent-ink); }
.toast:not([hidden]) { animation: toastin .28s cubic-bezier(.2, .7, .2, 1); }
@keyframes toastin { from { transform: translateY(14px); } }
.bar i { animation: grow .9s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes grow { from { width: 0; } }
.burst { position: relative; height: 0; overflow: visible; pointer-events: none; }
.burst i { position: absolute; bottom: 0; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; border: 2px solid var(--accent); animation: burst 2.4s ease-out var(--d) both; }
@keyframes burst { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-240px); opacity: 0; } }
.tile.c { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.slot { border: 2px dashed var(--line); border-radius: 14px; min-height: 104px; display: grid; place-items: center; padding: 10px; text-align: center; font-size: 15px; min-width: 0; }
.slot.filled { border-style: solid; border-color: var(--fg); background: var(--surface); }
.slot.filled.new { animation: slotin .35s cubic-bezier(.2, .7, .2, 1); }
@keyframes slotin { from { transform: scale(.9); } }
.slot b { font-family: var(--font-display); font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.pickbtn { font: inherit; text-align: left; background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.pickbtn b { font-family: var(--font-display); font-size: 18px; line-height: 1.15; }
.pickbtn:hover:not([disabled]) { transform: translateY(-2px); border-color: var(--fg); }
.pickbtn[disabled] { opacity: .45; cursor: default; }
@media (max-width: 560px) { .slots { grid-template-columns: minmax(0, 1fr); } .slot { min-height: 72px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .burst { display: none; }
  .ticker .track { flex-wrap: wrap; width: auto; }
  .ticker .grp { flex-wrap: wrap; }
  .ticker .grp[aria-hidden] { display: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="ticker" id="ticker" aria-label="Store notices"></div>
  <header>
    <a class="logo" href="#home">Salt<span>wick</span></a>
    <nav aria-label="Main" id="nav">
      <a href="#shop" data-r="shop">Shop</a>
      <a href="#gifts" data-r="gifts">Gift sets</a>
      <a href="#build" data-r="build">Build a box</a>
      <a href="#finder" data-r="finder">Scent finder</a>
      <a href="#about" data-r="about">About</a>
      <a href="#help" data-r="help">Help</a>
      <a href="#contact" data-r="contact">Contact</a>
    </nav>
    <div class="hacts">
      <button type="button" class="hbtn iconbtn" id="themeBtn" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <a class="hbtn" id="acctLink" href="#account" data-r="account">Account</a>
      <a class="hbtn" id="cartBtn" href="#cart" data-r="cart">Cart <b id="cartCount">0</b></a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer>
    <span>Saltwick Bath &amp; Candle. Made by hand in small batches.</span>
    <nav aria-label="Footer">
      <a href="#shop">Shop</a>
      <a href="#help">Shipping and returns</a>
      <a href="#contact">Contact</a>
      <a href="#account">Account</a>
    </nav>
  </footer>
</div>

<div class="toasts" aria-live="polite"><div class="toast" id="toast" hidden></div></div>

<script>
(function () {
  "use strict";
  var EMAIL = "hello@saltwick.example";
  var FREE_SHIP = 50, FLAT_SHIP = 5.95, PROMO_CODE = "WELCOME10", PROMO_PCT = 10;
  var catLabel = { soap: "Soap", bomb: "Bath bomb", candle: "Candle", gift: "Gift set" };

  var products = [
    { id: "s1", cat: "soap", name: "Oat & Honey", notes: "Colloidal oat, raw honey, soft vanilla. Gentle on dry skin.", size: "4.5 oz bar", price: 8, tags: ["cozy", "calm"] },
    { id: "s2", cat: "soap", name: "Eucalyptus Mint", notes: "Cool, clean and sharp. A good morning bar.", size: "4.5 oz bar", price: 8, tags: ["fresh"] },
    { id: "s3", cat: "soap", name: "Rose Clay", notes: "Pink kaolin clay with rose and a little geranium.", size: "4.5 oz bar", price: 9, tags: ["sweet", "calm"] },
    { id: "b1", cat: "bomb", name: "Citrus Fizz", notes: "Orange and grapefruit, with a pinch of dried peel on top.", size: "5 oz", price: 6, tags: ["fresh", "sweet"] },
    { id: "b2", cat: "bomb", name: "Lavender Fields", notes: "Lavender buds and a soft violet swirl.", size: "5 oz", price: 6, tags: ["calm"] },
    { id: "b3", cat: "bomb", name: "Cotton Candy Pop", notes: "Sweet, bright and very pink. Fizzes hard.", size: "5 oz", price: 6, tags: ["sweet"] },
    { id: "c1", cat: "candle", name: "Cedar & Smoke", notes: "Cedarwood, campfire and a touch of black pepper.", size: "8 oz jar", price: 22, tags: ["cozy"] },
    { id: "c2", cat: "candle", name: "Vanilla Bean", notes: "Warm vanilla with a little brown sugar.", size: "8 oz jar", price: 22, tags: ["sweet", "cozy"] },
    { id: "c3", cat: "candle", name: "Amber Fig", notes: "Ripe fig, amber resin and dry grass.", size: "8 oz jar", price: 22, tags: ["cozy"] },
    { id: "g1", cat: "gift", name: "Bath Night Box", notes: "A soap, a bath bomb and a candle for one slow evening.", price: 32, includes: ["s1", "b2", "c2"], tags: ["calm", "cozy"] },
    { id: "g2", cat: "gift", name: "Fizz Set", notes: "Three bath bombs, three very different baths.", price: 15, includes: ["b1", "b2", "b3"], tags: ["fresh", "sweet", "calm"] },
    { id: "g3", cat: "gift", name: "Soap Trio", notes: "All three bars, wrapped together.", price: 22, includes: ["s1", "s2", "s3"], tags: ["fresh", "calm"] },
    { id: "g4", cat: "gift", name: "Candle Duo", notes: "Two 8 oz candles for a warm room.", price: 40, includes: ["c1", "c3"], tags: ["cozy"] }
  ];
  function baseById(id) { for (var i = 0; i < products.length; i++) { if (products[i].id === id) return products[i]; } return null; }
  function boxId(arr) { return "x-" + arr.slice().sort().join("-"); }
  function makeBox(id) {
    var parts = id.split("-").slice(1), sum = 0;
    if (parts.length !== 3) return null;
    for (var i = 0; i < 3; i++) { var q = baseById(parts[i]); if (!q || q.cat === "gift") return null; sum += q.price; }
    return { id: id, cat: "gift", name: "Build-a-box", notes: "Your own pick of three.", price: Math.round(sum * 0.9), includes: parts, tags: [] };
  }
  function byId(id) {
    var p = baseById(id);
    if (p) return p;
    return (typeof id === "string" && /^x(-[sbc][0-9])+$/.test(id)) ? makeBox(id) : null;
  }
  function sizeOf(p) { return p.includes ? p.includes.length + " items" : p.size; }
  function saving(p) { if (!p.includes) return 0; var s = 0; p.includes.forEach(function (i) { s += byId(i).price; }); return s - p.price; }

  var care = {
    soap: "Keep the bar on a draining dish between uses so it lasts longer. Store unused bars somewhere dry.",
    bomb: "Drop one into a running or filled tub. Keep it dry until you use it, since the fizz starts the moment it meets water. Rinse the tub after your bath.",
    candle: "Trim the wick to 1/4 inch before each burn. On the first burn, let the wax melt to the edge of the jar. Never leave a candle burning unattended, and stop when 1/2 inch of wax is left.",
    gift: "Every item in the box is packed ready to give. Care notes for each one are on its own page."
  };
  var ingredientsNote = "A full ingredient list is printed on every label. If you have allergies or sensitive skin, email us before you order and we will send the list ahead.";
  var shipNote = "Orders ship in 2 to 4 business days. Shipping is " + "$" + FLAT_SHIP.toFixed(2) + ", free on orders of $" + FREE_SHIP + " or more.";

  var thumbs = {
    soap: '<svg viewBox="0 0 120 80" aria-hidden="true"><rect x="14" y="14" width="92" height="52" rx="14" fill="var(--sea)" stroke="var(--fg)" stroke-width="3"/><rect x="28" y="26" width="30" height="7" rx="3.5" fill="var(--bg)" opacity=".7"/></svg>',
    bomb: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="40" fill="var(--lilac)" stroke="var(--fg)" stroke-width="3"/><circle cx="38" cy="40" r="4" fill="var(--bg)"/><circle cx="62" cy="62" r="5" fill="var(--bg)"/><circle class="fz" cx="40" cy="30" r="3.5" fill="none" stroke="var(--fg)" stroke-width="2"/><circle class="fz" cx="56" cy="26" r="3" fill="none" stroke="var(--fg)" stroke-width="2" style="animation-delay:.8s"/><circle class="fz" cx="68" cy="34" r="2.5" fill="none" stroke="var(--fg)" stroke-width="2" style="animation-delay:1.5s"/></svg>',
    candle: '<svg viewBox="0 0 100 110" aria-hidden="true"><path class="flame" d="M50 4c8 10 11 17 5 24-3 4-9 4-11-1-2-6 3-11 6-23z" fill="var(--accent)" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/><rect x="18" y="34" width="64" height="68" rx="10" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/></svg>',
    gift: '<svg viewBox="0 0 110 100" aria-hidden="true"><rect x="12" y="38" width="86" height="56" rx="8" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/><rect x="8" y="24" width="94" height="20" rx="6" fill="var(--sea)" stroke="var(--fg)" stroke-width="3"/><path d="M55 24v70" stroke="var(--accent)" stroke-width="8"/><path d="M55 24c-6-16-24-16-22-6 2 8 16 6 22 6zM55 24c6-16 24-16 22-6-2 8-16 6-22 6z" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/></svg>'
  };
  var heartSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  /* helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(n) { return "$" + (Number(n) || 0).toFixed(2); }
  function firstName(n) { return String(n || "").split(" ")[0]; }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("sw:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("sw:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep going in memory */ } }
  };

  /* state */
  var cart = {};
  (function () {
    var c = store.get("cart", {});
    if (c && typeof c === "object") Object.keys(c).forEach(function (id) { var q = parseInt(c[id], 10); if (byId(id) && q > 0) cart[id] = Math.min(q, 99); });
  })();
  var wish = store.get("wish", []);
  wish = Array.isArray(wish) ? wish.filter(function (id) { return !!byId(id); }) : [];
  var profile = store.get("profile", null);
  if (!profile || typeof profile !== "object") profile = null;
  var orders = store.get("orders", []);
  if (!Array.isArray(orders)) orders = [];
  var promoOn = store.get("promo", false) === true;
  var lastNo = store.get("lastNo", "");

  var shopF = "all", shopQ = "", shopS = "featured";
  var quiz = { mood: null, kind: null };
  var askRemove = false;
  var box = [], boxJust = false;

  var view = document.getElementById("view");
  var toastEl = document.getElementById("toast");
  var toastT = null;

  function toast(msg, link) {
    toastEl.innerHTML = esc(msg) + (link ? ' <a href="' + link.href + '">' + esc(link.text) + "</a>" : "");
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.hidden = true; }, 3800);
  }
  function copyFrom(text, el, okMsg) {
    function fail() {
      if (el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast("Copy was blocked. The text is selected, copy it by hand.");
    }
    try { navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fail); } catch (e) { fail(); }
  }

  /* cart */
  function cartCount() { var n = 0; Object.keys(cart).forEach(function (k) { n += cart[k]; }); return n; }
  function totals() {
    var sub = 0;
    Object.keys(cart).forEach(function (id) { var p = byId(id); if (p) sub += p.price * cart[id]; });
    var disc = promoOn ? Math.round(sub * PROMO_PCT) / 100 : 0;
    var after = sub - disc;
    var ship = (sub === 0 || after >= FREE_SHIP) ? 0 : FLAT_SHIP;
    return { sub: sub, disc: disc, after: after, ship: ship, total: after + ship };
  }
  function persistCart() { store.set("cart", cart); updateHeader(); }
  function addToCart(id, q) { cart[id] = Math.min((cart[id] || 0) + q, 99); persistCart(); bump(); }
  function setQty(id, q) { if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 99); persistCart(); }
  function toggleWish(id) {
    var i = wish.indexOf(id);
    if (i > -1) wish.splice(i, 1); else wish.push(id);
    store.set("wish", wish);
    var on = wish.indexOf(id) > -1;
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="wish"][data-id="' + id + '"]'), function (b) {
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.classList.remove("pop"); void b.offsetWidth; if (on) b.classList.add("pop");
      b.setAttribute("aria-label", (on ? "Remove " : "Save ") + byId(id).name + (on ? " from saved items" : " to saved items"));
    });
    if (currentRoute() === "account") refresh();
  }

  function updateHeader() {
    var n = cartCount();
    document.getElementById("cartCount").textContent = n;
    document.getElementById("cartBtn").setAttribute("aria-label", "Cart, " + n + (n === 1 ? " item" : " items"));
    document.getElementById("acctLink").textContent = (profile && profile.name) ? firstName(profile.name) : "Account";
  }

  /* components */
  function card(p, i) {
    var on = wish.indexOf(p.id) > -1;
    return '<article class="card" style="--i:' + (i || 0) + '">' +
      '<a class="thumb t-' + p.cat + '" href="#p-' + p.id + '" aria-label="View ' + esc(p.name) + '">' + thumbs[p.cat] + "</a>" +
      '<div><span class="label">' + catLabel[p.cat] + '</span><h3><a href="#p-' + p.id + '">' + esc(p.name) + "</a></h3></div>" +
      '<p class="notes">' + esc(p.notes) + "</p>" +
      '<div class="foot"><span class="price">' + money(p.price) + "<small>" + esc(sizeOf(p)) + "</small></span>" +
      '<span class="acts"><button type="button" class="heart" data-act="wish" data-id="' + p.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Remove " : "Save ") + esc(p.name) + (on ? " from saved items" : " to saved items") + '">' + heartSvg + "</button>" +
      '<button type="button" class="add" data-act="add" data-id="' + p.id + '" aria-label="Add ' + esc(p.name) + ' to cart">Add</button></span></div></article>';
  }
  function benchStrip() {
    return '<div class="bench" aria-label="Batch notes">' +
      '<div><span class="label">Soap</span><b>Cured 4 to 6 weeks</b><span>Cold process bars, cut by hand and rested before they ship.</span></div>' +
      '<div><span class="label">Bath bombs</span><b>5 oz, made dry</b><span>Pressed in low humidity so they stay firm until the tub.</span></div>' +
      '<div><span class="label">Candles</span><b>40 to 50 hour burn</b><span>8 oz soy wax in a jar, cotton wick, trimmed to 1/4 inch.</span></div></div>';
  }
  function stepper(id, q) {
    return '<span class="stepper"><button type="button" data-act="dec" data-id="' + id + '" aria-label="Remove one">-</button><span aria-live="polite">' + q + '</span><button type="button" data-act="inc" data-id="' + id + '" aria-label="Add one">+</button></span>';
  }
  function field(id, label, val, o) {
    o = o || {};
    return '<div class="field' + (o.span2 ? " span2" : "") + '"><label for="' + id + '">' + label + (o.req ? "" : " (optional)") + "</label>" +
      '<input id="' + id + '" type="' + (o.type || "text") + '" value="' + esc(val) + '"' + (o.req ? " required" : "") + (o.auto ? ' autocomplete="' + o.auto + '"' : "") + "></div>";
  }
  function addressFields(prefix, v) {
    v = v || {};
    return field(prefix + "-addr1", "Address", v.addr1, { req: true, auto: "address-line1", span2: true }) +
      field(prefix + "-addr2", "Apartment, suite, etc.", v.addr2, { auto: "address-line2", span2: true }) +
      field(prefix + "-city", "City", v.city, { req: true, auto: "address-level2" }) +
      field(prefix + "-region", "State or region", v.region, { req: true, auto: "address-level1" }) +
      field(prefix + "-zip", "Postal code", v.zip, { req: true, auto: "postal-code" }) +
      field(prefix + "-country", "Country", v.country || "United States", { req: true, auto: "country-name" });
  }
  function pageHead(title, sub) {
    return "<div><h1 class='page-title'>" + title + "</h1>" + (sub ? "<p class='page-sub'>" + sub + "</p>" : "") + "</div>";
  }

  /* pages */
  function renderHome() {
    var feat = ["s1", "b1", "c1"].map(byId).map(card).join("");
    view.innerHTML =
      '<div class="hero"><div class="bubbles" aria-hidden="true">' +
      '<i style="width:44px;height:44px;left:52%;top:6%"></i><i style="width:22px;height:22px;left:64%;top:26%;animation-delay:-3s"></i><i style="width:70px;height:70px;left:86%;top:12%;animation-delay:-5s"></i><i style="width:16px;height:16px;left:6%;top:72%;animation-delay:-2s"></i><i style="width:34px;height:34px;left:92%;top:64%;animation-delay:-7s"></i></div>' +
      '<h1><span class="hl" style="--d:0">Wash up.</span><span class="hl" style="--d:1"><em>Fizz</em> out.</span><span class="hl" style="--d:2">Light one.</span></h1>' +
      '<div class="hero-row"><div><p class="lede">Handmade soap, bath bombs and soy candles, poured and cut in small batches.</p>' +
      '<div class="hero-cta"><a class="btn primary" href="#shop">Shop the batch</a><a class="btn" href="#finder">Find your scent</a></div></div>' +
      '<div class="trio" aria-hidden="true">' +
      '<svg viewBox="0 0 120 150"><g transform="rotate(-8 60 90)"><rect x="12" y="60" width="96" height="64" rx="16" fill="var(--sea)" stroke="var(--fg)" stroke-width="3"/><rect x="26" y="72" width="34" height="8" rx="4" fill="var(--bg)" opacity=".7"/><circle cx="84" cy="98" r="5" fill="var(--bg)" opacity=".6"/><circle cx="40" cy="106" r="3" fill="var(--bg)" opacity=".6"/></g><circle cx="94" cy="30" r="10" fill="none" stroke="var(--fg)" stroke-width="2.5"/><circle cx="74" cy="14" r="6" fill="none" stroke="var(--fg)" stroke-width="2.5"/></svg>' +
      '<svg viewBox="0 0 120 150"><circle cx="60" cy="88" r="50" fill="var(--lilac)" stroke="var(--fg)" stroke-width="3"/><path d="M14 88a46 46 0 0 1 92 0" fill="var(--accent)" opacity=".55"/><circle cx="44" cy="70" r="4" fill="var(--bg)"/><circle cx="76" cy="104" r="5" fill="var(--bg)"/><circle cx="62" cy="124" r="3" fill="var(--bg)"/><circle cx="84" cy="66" r="3" fill="var(--bg)"/><circle class="fz" cx="50" cy="46" r="4" fill="none" stroke="var(--fg)" stroke-width="2"/><circle class="fz" cx="72" cy="42" r="3" fill="none" stroke="var(--fg)" stroke-width="2" style="animation-delay:1s"/><circle cx="100" cy="22" r="7" fill="none" stroke="var(--fg)" stroke-width="2.5"/></svg>' +
      '<svg viewBox="0 0 120 150"><path class="flame" d="M60 8c10 14 14 22 6 32-4 5-12 5-14-2-3-8 4-14 8-30z" fill="var(--accent)" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/><path d="M60 44v14" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/><rect x="20" y="58" width="80" height="80" rx="12" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/><rect x="20" y="58" width="80" height="22" rx="12" fill="var(--accent)" opacity=".3"/><rect x="34" y="96" width="52" height="16" rx="3" fill="none" stroke="var(--fg)" stroke-width="2.5"/></svg>' +
      "</div></div></div>" +
      benchStrip() +
      '<div class="page"><div class="sec-head"><div><span class="label">New to Saltwick</span><h2>Start here</h2></div><a class="btn small" href="#shop">See everything</a></div>' +
      '<div class="grid">' + feat + "</div>" +
      '<div class="tiles"><div class="tile a"><span class="label">Gift sets</span><h3>Ready to give.</h3><p>Soap trios, fizz sets and candle duos, boxed for less than buying each one.</p><a class="btn" href="#gifts">See gift sets</a></div>' +
      '<div class="tile b"><span class="label">Scent finder</span><h3>Not sure which?</h3><p>Answer two questions and get three picks that fit your evening.</p><a class="btn" href="#finder">Find your scent</a></div>' +
      '<div class="tile c"><span class="label">Build a box</span><h3>Pick your own three.</h3><p>Mix any soap, bath bomb or candle and save 10% on the box.</p><a class="btn" href="#build">Build a box</a></div></div></div>';
  }

  function drawShopGrid(still) {
    var q = shopQ.trim().toLowerCase();
    var list = products.filter(function (p) {
      if (shopF !== "all" && p.cat !== shopF) return false;
      if (q && (p.name + " " + p.notes + " " + catLabel[p.cat]).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if (shopS === "low") list.sort(function (a, b) { return a.price - b.price; });
    else if (shopS === "high") list.sort(function (a, b) { return b.price - a.price; });
    else if (shopS === "az") list.sort(function (a, b) { return a.name.localeCompare(b.name); });
    var gridEl = document.getElementById("grid");
    gridEl.classList.toggle("still", !!still);
    gridEl.innerHTML = list.map(card).join("");
    var none = document.getElementById("shopNone");
    none.hidden = list.length > 0;
    document.getElementById("shopCount").textContent = list.length + (list.length === 1 ? " product" : " products");
  }
  function renderShop() {
    var chips = [["all", "All"], ["soap", "Soap"], ["bomb", "Bath bombs"], ["candle", "Candles"], ["gift", "Gift sets"]].map(function (c) {
      return '<button type="button" data-act="filter" data-v="' + c[0] + '" aria-pressed="' + (shopF === c[0]) + '">' + c[1] + "</button>";
    }).join("");
    view.innerHTML = '<div class="page">' + pageHead("The shelf", "Everything in the current batch.") +
      '<div class="controls"><input class="search" id="q" type="search" placeholder="Search scents and products" aria-label="Search products" value="' + esc(shopQ) + '">' +
      '<select class="sel" id="sort" aria-label="Sort products"><option value="featured"' + (shopS === "featured" ? " selected" : "") + '>Featured</option><option value="low"' + (shopS === "low" ? " selected" : "") + '>Price, low to high</option><option value="high"' + (shopS === "high" ? " selected" : "") + '>Price, high to low</option><option value="az"' + (shopS === "az" ? " selected" : "") + ">Name, A to Z</option></select></div>" +
      '<div class="filters" role="group" aria-label="Filter by type">' + chips + "</div>" +
      '<span class="label" id="shopCount" aria-live="polite"></span>' +
      '<div class="grid" id="grid"></div><p class="empty" id="shopNone" hidden>Nothing matches that search. Try a different word or clear the filter.</p></div>';
    drawShopGrid();
  }

  function renderGifts() {
    var gifts = products.filter(function (p) { return p.cat === "gift"; });
    var html = gifts.map(function (p, gi) {
      var on = wish.indexOf(p.id) > -1, sv = saving(p);
      return '<article class="card" style="--i:' + gi + '"><a class="thumb t-gift" href="#p-' + p.id + '" aria-label="View ' + esc(p.name) + '">' + thumbs.gift + "</a>" +
        '<div><span class="pill">Save ' + money(sv) + '</span><h3 style="margin-top:8px"><a href="#p-' + p.id + '">' + esc(p.name) + "</a></h3></div>" +

      setTimeout(function () { if (document.body.contains(b)) { b.textContent = "Add"; b.classList.remove("done"); } }, 1300);
    }
    else if (act === "add-pdp") { var n = parseInt(document.getElementById("pq").textContent, 10) || 1; addToCart(id, n); toast("Added " + n + " x " + byId(id).name + ".", { href: "#cart", text: "View cart" }); }
    else if (act === "pq-inc" || act === "pq-dec") { var el = document.getElementById("pq"), c = parseInt(el.textContent, 10) || 1; el.textContent = Math.max(1, Math.min(99, c + (act === "pq-inc" ? 1 : -1))); }
    else if (act === "wish") { toggleWish(id); }
    else if (act === "box-add") { if (box.length < 3) { box.push(id); boxJust = true; refresh(); } }
    else if (act === "box-rm") { box.splice(parseInt(b.getAttribute("data-i"), 10), 1); boxJust = false; refresh(); }
    else if (act === "box-clear") { box = []; boxJust = false; refresh(); }
    else if (act === "box-cart") { if (box.length === 3) { addToCart(boxId(box), 1); box = []; boxJust = false; refresh(); toast("Added your box.", { href: "#cart", text: "View cart" }); } }
    else if (act === "add-picks") { var ps = b.getAttribute("data-ids").split(","); ps.forEach(function (x) { if (byId(x)) addToCart(x, 1); }); toast("Added " + ps.length + " items.", { href: "#cart", text: "View cart" }); }
    else if (act === "reorder") {
      var added = 0;
      orders.forEach(function (o) {
        if (o.no !== b.getAttribute("data-no")) return;
        (o.lines || []).forEach(function (l) {
          var p = byId(l.id) || products.filter(function (x) { return x.name === l.name; })[0];
          if (p) { addToCart(p.id, Math.max(1, parseInt(l.qty, 10) || 1)); added++; }
        });
      });
      toast(added ? "Added " + added + (added === 1 ? " item" : " items") + " to your cart." : "Those items are no longer available.", added ? { href: "#cart", text: "View cart" } : null);
    }
    else if (act === "inc") { setQty(id, (cart[id] || 0) + 1); refresh(); }
    else if (act === "dec") { setQty(id, (cart[id] || 0) - 1); refresh(); }
    else if (act === "rm") { setQty(id, 0); refresh(); }
    else if (act === "filter") {
      shopF = b.getAttribute("data-v");
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="filter"]'), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      drawShopGrid();
    }
    else if (act === "quiz") { quiz[b.getAttribute("data-k")] = b.getAttribute("data-v"); refresh(); }
    else if (act === "quiz-reset") { quiz = { mood: null, kind: null }; refresh(); }
    else if (act === "copy") { var src = document.getElementById(b.getAttribute("data-src")); copyFrom(src.textContent, src, b.getAttribute("data-ok")); }
    else if (act === "promo-off") { promoOn = false; store.set("promo", false); refresh(); }
    else if (act === "rm-ask") { askRemove = true; refresh(); }
    else if (act === "rm-no") { askRemove = false; refresh(); }
    else if (act === "rm-yes") {
      profile = null; wish = []; orders = []; lastNo = ""; askRemove = false;
      store.set("profile", null); store.set("wish", []); store.set("orders", []); store.set("lastNo", "");
      updateHeader(); refresh(); toast("Removed from this device.");
    }
  });
  view.addEventListener("input", function (e) { if (e.target.id === "q") { shopQ = e.target.value; drawShopGrid(true); } });
  view.addEventListener("change", function (e) { if (e.target.id === "sort") { shopS = e.target.value; drawShopGrid(); } });

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
  function readAddr(prefix) {
    return { addr1: val(prefix + "-addr1"), addr2: val(prefix + "-addr2"), city: val(prefix + "-city"), region: val(prefix + "-region"), zip: val(prefix + "-zip"), country: val(prefix + "-country") };
  }
  function newOrderNo() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return "SW-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + Math.floor(1000 + Math.random() * 9000); }

  view.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === "promoForm") {
      var code = val("promo").toUpperCase(), msg = document.getElementById("promoMsg");
      if (code === PROMO_CODE) { promoOn = true; store.set("promo", true); refresh(); toast("Promo code applied."); }
      else msg.textContent = code ? "That code is not valid." : "Enter a code first.";
    } else if (id === "signupForm") {
      profile = { name: val("su-name"), email: val("su-email"), phone: "", addr1: "", addr2: "", city: "", region: "", zip: "", country: "United States" };
      store.set("profile", profile); updateHeader(); refresh(); toast("Account created on this device.");
    } else if (id === "profileForm") {
      var a = readAddr("pf");
      profile = { name: val("pf-name"), email: val("pf-email"), phone: val("pf-phone"), addr1: a.addr1, addr2: a.addr2, city: a.city, region: a.region, zip: a.zip, country: a.country };
      store.set("profile", profile); updateHeader();
      var m = document.getElementById("pfMsg"); if (m) m.textContent = "Saved.";
    } else if (id === "checkoutForm") {
      var ids = Object.keys(cart); if (!ids.length) return;
      var t = totals(), ad = readAddr("co");
      var cust = { name: val("co-name"), email: val("co-email"), phone: val("co-phone"), addr1: ad.addr1, addr2: ad.addr2, city: ad.city, region: ad.region, zip: ad.zip, country: ad.country };
      var o = {
        no: newOrderNo(), date: new Date().toISOString(), customer: cust, note: val("co-note"),
        lines: ids.map(function (i) { var p = byId(i); return { id: i, name: p.name, label: catLabel[p.cat] + ", " + sizeOf(p), qty: cart[i], price: p.price }; }),
        sub: t.sub, disc: t.disc, ship: t.ship, total: t.total, promo: promoOn ? PROMO_CODE : ""
      };
      orders.unshift(o); orders = orders.slice(0, 20); lastNo = o.no;
      store.set("orders", orders); store.set("lastNo", lastNo);
      var save = document.getElementById("co-save");
      if (save && save.checked) { profile = cust; store.set("profile", profile); }
      cart = {}; persistCart();
      location.hash = "confirmed";
    }
  });

  function applyTheme(t) { if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }
  applyTheme(store.get("theme", null));
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    applyTheme(next); store.set("theme", next);
  });
  initTicker();
  updateHeader();
  route(false);
})();
</script>
</body>
</html>
